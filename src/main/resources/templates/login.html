<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .brand-logo {
            width: 70px;
            height: 70px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }
        .btn-custom {
            background: #22c55e;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="brand-logo">
        <i class="fas fa-utensils"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Food Express</h3>
    <p class="text-muted small mb-4">Welcome back! Please login to your account.</p>

    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}">
        Invalid Credentials
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" required>
            </div>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label small fw-bold text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-custom w-100 mb-3 text-white">Login</button>
    </form>

    <div class="text-center mt-3">
        <span class="small text-muted">Don't have an account? </span>
        <a th:href="@{/}" class="small text-success fw-bold text-decoration-none">Register Here</a>
    </div>
</div>

</body>
</html>
