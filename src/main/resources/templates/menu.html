<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Menu - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="text-success fw-bold">Food Express Menu</h2>
    <div>
        <a th:href="@{/login}" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

<!-- Alert Message after placing order -->
<div th:if="${param.ordered}" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Success!</strong> Your order has been placed successfully.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Available Items Cards -->
<div class="row">
    <div class="col-md-4 mb-4" th:each="item : ${items}">
        <div class="card h-100 shadow-sm border-0 bg-light">
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <span class="badge bg-secondary mb-2" th:text="${item.category}">Category</span>
                    <h5 class="card-title fw-bold text-dark" th:text="${item.name}">Item Name</h5>
                    <p class="card-text text-primary fs-5 fw-bold" th:text="${'Rs. ' + item.price}">Rs. 0.00</p>
                </div>

                <form th:action="@{/order/place}" method="post" class="mt-3">
                    <input type="hidden" name="itemName" th:value="${item.name}">
                    <input type="hidden" name="price" th:value="${item.price}">
                    <div class="mb-2">
                        <label class="form-label text-muted small mb-1">Quantity:</label>
                        <input type="number" name="quantity" class="form-control form-control-sm" value="1" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Order Now</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
