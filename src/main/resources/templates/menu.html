<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Menu - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="text-success fw-bold">Food Express Menu</h2>
    <div>
        <a th:href="@{/login}" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

<!-- Alert Success Message -->
<div th:if="${param.ordered}" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Order Confirmed!</strong> Your order and delivery details have been recorded successfully.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Available Food Items Grid -->
<div class="row">
    <div class="col-md-4 mb-4" th:each="item, iter : ${items}">
        <div class="card h-100 shadow-sm border-0 bg-light">
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <span class="badge bg-secondary mb-2" th:text="${item.category}">Category</span>
                    <h5 class="card-title fw-bold text-dark" th:text="${item.name}">Item Name</h5>
                    <p class="card-text text-primary fs-5 fw-bold" th:text="${'Rs. ' + item.price}">Rs. 0.00</p>
                </div>

                <div class="mt-3">
                    <div class="mb-2">
                        <label class="form-label text-muted small mb-1">Quantity:</label>
                        <input type="number" th:id="${'qty-' + iter.index}" class="form-control form-control-sm" value="1" min="1" required>
                    </div>
                    <button type="button" class="btn btn-success w-100"
                            data-bs-toggle="modal"
                            th:data-bs-target="${'#checkoutModal-' + iter.index}">
                        Order Now
                    </button>
                </div>
            </div>
        </div>

        <!-- Checkout Modal for each item -->
        <div class="modal fade" th:id="${'checkoutModal-' + iter.index}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title fw-bold">Delivery & Payment Details</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/order/checkout}" method="post">
                        <div class="modal-body">
                            <input type="hidden" name="itemName" th:value="${item.name}">
                            <input type="hidden" name="price" th:value="${item.price}">
                            <input type="hidden" name="quantity" th:id="${'form-qty-' + iter.index}" value="1">

                            <div class="mb-2">
                                <label class="form-label font-weight-bold">Item Ordered:</label>
                                <p class="fw-bold text-success mb-1" th:text="${item.name}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Your Full Name</label>
                                <input type="text" name="customerName" class="form-control" placeholder="Enter full name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Delivery Address</label>
                                <textarea name="address" class="form-control" rows="2" placeholder="Enter delivery address" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="07XXXXXXXX" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Payment Method</label>
                                <select name="paymentMethod" class="form-select" required>
                                    <option value="Cash on Delivery">Cash on Delivery</option>
                                    <option value="Credit / Debit Card">Credit / Debit Card</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success"
                                    th:onclick="'document.getElementById(\'form-qty-' + ${iter.index} + '\').value = document.getElementById(\'qty-' + ${iter.index} + '\').value;'">
                                Confirm Order
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
