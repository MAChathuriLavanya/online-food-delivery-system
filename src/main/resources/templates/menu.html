<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Menu - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="text-success fw-bold">Food Express Menu</h2>
    <div>
        <a th:href="@{/login}" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

<!-- Alert Success Message -->
<div th:if="${param.ordered}" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Order Confirmed!</strong> Your order and delivery details have been recorded successfully.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<form th:action="@{/order/checkout}" method="post" id="orderForm">
    <!-- Available Food Items Grid -->
    <div class="row">
        <div class="col-md-4 mb-4" th:each="item, iter : ${items}">
            <div class="card h-100 shadow-sm border-0 bg-light">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-secondary" th:text="${item.category}">Category</span>
                            <div class="form-check form-switch">
                                <input class="form-check-input item-select" type="checkbox"
                                       th:data-price="${item.price}"
                                       th:data-name="${item.name}"
                                       th:id="${'chk-' + iter.index}"
                                       onchange="calculateTotal()">
                                <label class="form-check-label small fw-bold" th:for="${'chk-' + iter.index}">Select</label>
                            </div>
                        </div>
                        <h5 class="card-title fw-bold text-dark" th:text="${item.name}">Item Name</h5>
                        <p class="card-text text-primary fs-5 fw-bold" th:text="${'Rs. ' + item.price}">Rs. 0.00</p>
                    </div>

                    <div class="mt-3">
                        <label class="form-label text-muted small mb-1">Quantity:</label>
                        <input type="number" class="form-control form-control-sm item-qty"
                               value="1" min="1"
                               th:id="${'qty-' + iter.index}"
                               onchange="calculateTotal()" oninput="calculateTotal()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Cart Summary Bar at Bottom -->
    <div class="fixed-bottom bg-dark text-white p-3 shadow-lg d-flex justify-content-between align-items-center px-4">
        <div>
            <span class="fs-5">Selected Items: <strong id="selectedCount" class="text-warning">0</strong></span>
            <span class="ms-4 fs-5">Total Amount: <strong id="grandTotal" class="text-success">Rs. 0.00</strong></span>
        </div>
        <button type="button" class="btn btn-success btn-lg fw-bold" onclick="prepareCheckout()" data-bs-toggle="modal" data-bs-target="#checkoutModal">
            Proceed to Order
        </button>
    </div>

    <!-- Hidden input fields for backend submission -->
    <input type="hidden" name="itemName" id="finalItemDetails">
    <input type="hidden" name="price" id="finalPrice" value="0">
    <input type="hidden" name="quantity" value="1">

    <!-- Checkout Modal -->
    <div class="modal fade text-dark" id="checkoutModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold">Order Summary & Delivery Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Order Summary Box -->
                    <div class="card p-3 bg-light mb-3 border-success">
                        <h6 class="fw-bold text-success border-bottom pb-2">Selected Items:</h6>
                        <div id="modalOrderSummary" class="small text-muted mb-2">No items selected</div>
                        <div class="d-flex justify-content-between border-top pt-2 fw-bold fs-6">
                            <span>Total Price:</span>
                            <span id="modalGrandTotal" class="text-primary">Rs. 0.00</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Full Name</label>
                        <input type="text" name="customerName" class="form-control" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Enter delivery address" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="07XXXXXXXX" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="paymentMethod" class="form-select" required>
                            <option value="Cash on Delivery">Cash on Delivery</option>
                            <option value="Credit / Debit Card">Credit / Debit Card</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success fw-bold">Confirm & Place Order</button>
                </div>
            </div>
        </div>
    </div>
</form>

<script>
    function calculateTotal() {
        let checkboxes = document.querySelectorAll('.item-select');
        let quantities = document.querySelectorAll('.item-qty');
        let grandTotal = 0;
        let count = 0;

        checkboxes.forEach((chk, index) => {
            if (chk.checked) {
                let price = parseFloat(chk.getAttribute('data-price'));
                let qty = parseInt(quantities[index].value) || 1;
                grandTotal += (price * qty);
                count++;
            }
        });

        document.getElementById('selectedCount').innerText = count;
        document.getElementById('grandTotal').innerText = 'Rs. ' + grandTotal.toFixed(2);
    }

    function prepareCheckout() {
        let checkboxes = document.querySelectorAll('.item-select');
        let quantities = document.querySelectorAll('.item-qty');
        let summaryHtml = '';
        let itemDetailsText = '';
        let grandTotal = 0;
        let count = 0;

        checkboxes.forEach((chk, index) => {
            if (chk.checked) {
                let name = chk.getAttribute('data-name');
                let price = parseFloat(chk.getAttribute('data-price'));
                let qty = parseInt(quantities[index].value) || 1;
                let itemTotal = price * qty;
                grandTotal += itemTotal;
                count++;

                summaryHtml += `<div class="d-flex justify-content-between mb-1">
                        <span>${name} (x${qty})</span>
                        <span>Rs. ${itemTotal.toFixed(2)}</span>
                    </div>`;

                itemDetailsText += `${name} (x${qty}); `;
            }
        });

        if (count === 0) {
            alert('Please select at least one item before placing an order!');
            return false;
        }

        document.getElementById('modalOrderSummary').innerHTML = summaryHtml;
        document.getElementById('modalGrandTotal').innerText = 'Rs. ' + grandTotal.toFixed(2);
        document.getElementById('finalItemDetails').value = itemDetailsText;
        document.getElementById('finalPrice').value = grandTotal;
    }
</script>
</body>
</html>
