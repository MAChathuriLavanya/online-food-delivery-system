<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Menu - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="text-success fw-bold">Food Express Menu</h2>
    <div>
        <!-- Admin ට නැවත Dashboard එකට යාමට -->
        <a href="/admin" class="btn btn-outline-primary me-2">Go to Admin Dashboard</a>
        <a href="/" class="btn btn-outline-danger">Logout</a>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-4" th:each="item : ${items}">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <span class="badge bg-secondary mb-2" th:text="${item.category}">Category</span>
                <h5 class="card-title fw-bold" th:text="${item.name}">Item Name</h5>
                <p class="card-text text-primary fs-5" th:text="${'Rs. ' + item.price}">Rs. 0.00</p>
                <button class="btn btn-primary w-100" onclick="alert('Order Placed Successfully!')">Order Now</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
