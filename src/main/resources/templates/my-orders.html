<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light py-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark"><i class="fas fa-receipt text-success me-2"></i>My Placed Orders</h3>
        <div>
            <a href="/menu" class="btn btn-outline-success rounded-pill me-2 fw-bold">Back to Menu</a>
            <a href="/login" class="btn btn-outline-danger rounded-pill fw-bold">Logout</a>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger rounded-3" role="alert">
        The 5-minute time window to edit or cancel this order has expired!
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Order ID</th>
                    <th>Items</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Total Price</th>
                    <th>Remaining Time (5 Min)</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order, stat : ${orders}">
                    <td th:text="${order.orderId}" class="fw-bold text-primary"></td>
                    <td th:text="${order.itemName}" class="fw-semibold"></td>
                    <td th:text="${order.customerName}"></td>
                    <td th:text="${order.address}"></td>
                    <td th:text="${order.phone}"></td>
                    <td th:text="${'Rs. ' + order.totalPrice}" class="fw-bold text-success"></td>
                    <td>
                                <span class="badge bg-warning text-dark countdown-timer"
                                      th:id="${'timer-' + stat.index}"
                                      th:data-timestamp="${order.timestamp}">
                                    Calculating...
                                </span>
                    </td>
                    <td>
                        <div th:id="${'actions-' + stat.index}">
                            <button class="btn btn-sm btn-outline-primary rounded-pill me-1 fw-bold"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="${'#editModal-' + order.orderId}"
                                    th:data-orderid="${order.orderId}"
                                    th:data-existing="${order.itemName}"
                                    onclick="initModalItems(this.getAttribute('data-orderid'), this.getAttribute('data-existing'))">
                                <i class="fas fa-edit me-1"></i>Edit
                            </button>

                            <a th:href="@{'/order/delete/' + ${order.orderId}}"
                               class="btn btn-sm btn-outline-danger rounded-pill fw-bold"
                               onclick="return confirm('Do you really want to cancel this order?')">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                        </div>

                        <!-- Edit Order Modal -->
                        <div class="modal fade" th:id="${'editModal-' + order.orderId}" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered modal-lg">
                                <div class="modal-content">
                                    <form action="/order/customer-update" method="post" onsubmit="return validateEditForm(this)">
                                        <div class="modal-header bg-success text-white">
                                            <h5 class="modal-title fw-bold">Edit Order Details</h5>
                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body text-start">
                                            <input type="hidden" name="orderId" th:value="${order.orderId}">

                                            <div class="row">
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label small fw-bold">Name</label>
                                                    <input type="text" name="customerName" class="form-control" th:value="${order.customerName}" required>
                                                </div>
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label small fw-bold">Phone</label>
                                                    <input type="text" name="phone" class="form-control" th:value="${order.phone}" required>
                                                </div>
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label small fw-bold">Address</label>
                                                <input type="text" name="address" class="form-control" th:value="${order.address}" required>
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label small fw-bold">Payment Method</label>
                                                <select name="paymentMethod" class="form-select" required>
                                                    <option value="Cash on Delivery" th:selected="${order.paymentMethod == 'Cash on Delivery'}">Cash on Delivery</option>
                                                    <option value="Credit / Debit Card" th:selected="${order.paymentMethod == 'Credit / Debit Card'}">Credit / Debit Card</option>
                                                </select>
                                            </div>

                                            <!-- Items Select & Remove Section -->
                                            <hr>
                                            <h6 class="fw-bold text-success mb-2">Select / Add / Remove Food Items:</h6>
                                            <div class="border rounded-3 p-3 mb-3 bg-light" style="max-height: 220px; overflow-y: auto;">
                                                <div th:each="foodItem, fStat : ${allItems}" class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                                                    <div>
                                                        <span class="fw-semibold" th:text="${foodItem.name}"></span>
                                                        <small class="text-muted ms-2" th:text="${'Rs. ' + foodItem.price}"></small>
                                                    </div>
                                                    <div class="d-flex align-items-center">
                                                        <input type="number" min="1" value="1" class="form-control form-control-sm me-2 edit-qty" style="width: 65px;"
                                                               th:data-orderid="${order.orderId}"
                                                               onchange="calcEditTotal(this.getAttribute('data-orderid'))">
                                                        <input type="checkbox" class="form-check-input edit-item-chk"
                                                               th:data-name="${foodItem.name}"
                                                               th:data-price="${foodItem.price}"
                                                               th:data-orderid="${order.orderId}"
                                                               onchange="calcEditTotal(this.getAttribute('data-orderid'))">
                                                    </div>
                                                </div>
                                            </div>

                                            <input type="hidden" name="itemName" th:id="${'finalItemName-' + order.orderId}" th:value="${order.itemName}">
                                            <input type="hidden" name="totalPrice" th:id="${'finalTotalPrice-' + order.orderId}" th:value="${order.totalPrice}">

                                            <div class="d-flex justify-content-between align-items-center bg-white p-3 border rounded-3 shadow-sm">
                                                <span class="fw-bold text-secondary">Updated Total Amount:</span>
                                                <span class="fs-4 fw-bold text-success" th:id="${'dispTotal-' + order.orderId}" th:text="${'Rs. ' + order.totalPrice}"></span>
                                            </div>

                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                                            <button type="submit" class="btn btn-success fw-bold">Save Changes</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Real-time Countdown Timer (5 Minutes)
    function runTimer() {
        const now = new Date().getTime();
        const timers = document.querySelectorAll('.countdown-timer');

        timers.forEach((timer) => {
            const idNum = timer.id.replace('timer-', '');
            const actionBox = document.getElementById('actions-' + idNum);
            const orderTime = parseInt(timer.getAttribute('data-timestamp'));

            if (!orderTime || isNaN(orderTime)) return;

            const expireTime = orderTime + (5 * 60 * 1000);
            const diff = expireTime - now;

            if (diff > 0) {
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                timer.innerHTML = m + "m " + (s < 10 ? "0" : "") + s + "s left";
                timer.className = "badge bg-warning text-dark countdown-timer";
            } else {
                timer.innerHTML = "Time Expired (Confirmed)";
                timer.className = "badge bg-secondary countdown-timer";
                if (actionBox) {
                    actionBox.innerHTML = '<span class="text-muted small"><i class="fas fa-lock me-1"></i>Locked</span>';
                }
            }
        });
    }

    runTimer();
    setInterval(runTimer, 1000);

    // Edit Modal එක open වන විට දැනට Order එකේ තියෙන Items සහ Qty Auto-Select කිරීම
    function initModalItems(orderId, existingItemsStr) {
        const modal = document.getElementById('editModal-' + orderId);
        if (!modal) return;

        const checkboxes = modal.querySelectorAll('.edit-item-chk');
        const qtys = modal.querySelectorAll('.edit-qty');

        // Reset all first
        checkboxes.forEach((chk, idx) => {
            chk.checked = false;
            qtys[idx].value = 1;
        });

        // Parse existing items (e.g. "Chicken Burger (x2) Cheese Pizza (x1) ")
        checkboxes.forEach((chk, idx) => {
            const name = chk.getAttribute('data-name');
            if (existingItemsStr.includes(name)) {
                chk.checked = true;

                // Quantity එක Extract කිරීම
                const regExp = new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\(x(\\d+)\\)');
                const match = existingItemsStr.match(regExp);
                if (match && match[1]) {
                    qtys[idx].value = parseInt(match[1]);
                }
            }
        });

        calcEditTotal(orderId);
    }

    // Live Calculate Total & Item Details
    function calcEditTotal(orderId) {
        const modal = document.getElementById('editModal-' + orderId);
        if (!modal) return;

        const checkboxes = modal.querySelectorAll('.edit-item-chk');
        const qtys = modal.querySelectorAll('.edit-qty');

        let total = 0;
        let itemSummary = '';
        let count = 0;

        checkboxes.forEach((chk, idx) => {
            if (chk.checked) {
                let price = parseFloat(chk.getAttribute('data-price'));
                let name = chk.getAttribute('data-name');
                let q = parseInt(qtys[idx].value) || 1;
                total += (price * q);
                itemSummary += `${name} (x${q}) `;
                count++;
            }
        });

        document.getElementById('dispTotal-' + orderId).innerText = 'Rs. ' + total.toFixed(2);
        document.getElementById('finalTotalPrice-' + orderId).value = total;
        document.getElementById('finalItemName-' + orderId).value = itemSummary;
    }

    // Validation for Edit Form
    function validateEditForm(form) {
        const checkboxes = form.querySelectorAll('.edit-item-chk');
        let anyChecked = false;
        checkboxes.forEach(chk => {
            if (chk.checked) anyChecked = true;
        });

        if (!anyChecked) {
            alert('Please select at least one item for your order!');
            return false;
        }
        return true;
    }
</script>
</body>
</html>
