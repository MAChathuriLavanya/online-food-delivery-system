<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Food Delivery System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 380px;">
    <h3 class="text-center mb-1 fw-bold text-success">Food Express</h3>
    <p class="text-center text-muted mb-3">Create your account</p>
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register Account</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a th:href="@{/login}">Login Here</a></p>
</div>
</body>
</html>
