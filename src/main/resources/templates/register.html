<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Food Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .brand-icon {
            width: 70px;
            height: 70px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>
<div class="card-custom text-center">
    <div class="brand-icon">
        <i class="fas fa-user-plus"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Create Account</h3>
    <p class="text-muted small mb-4">Register as a new customer</p>

    <form th:action="@{/register}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold text-secondary">Username</label>
            <input type="text" name="username" class="form-control rounded-3 py-2" placeholder="Enter username" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small fw-bold text-secondary">Password</label>
            <input type="password" name="password" class="form-control rounded-3 py-2" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold mb-3">Register</button>
    </form>

    <div class="text-center">
        <span class="small text-muted">Already have an account? </span>
        <a th:href="@{/login}" class="small text-success fw-bold text-decoration-none">Login Here</a>
    </div>
</div>
</body>
</html>
