<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Food Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 380px;">
    <h3 class="text-center mb-3 fw-bold text-success">User Registration</h3>
    <form action="/register" method="post">
        <div class="mb-3">
            <label class="form-label">Choose Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Choose Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">දැනටමත් Account එකක් තියෙනවද? <a href="/">Login වන්න</a></p>
</div>
</body>
</html>
